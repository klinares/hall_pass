<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="lunchline logo: a school lunch tray with a calendar tucked underneath">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="360" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="68" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#1f2937">lunchline</text>
  <text x="40" y="100" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4b5563">school cafeteria → your calendar</text>

  <!-- the calendar peeking out behind the tray -->
  <g transform="translate(440, 130) rotate(-6)">
    <rect x="0" y="0" width="220" height="200" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <rect x="0" y="0" width="220" height="38" fill="#ef4444" rx="8"/>
    <rect x="0" y="22" width="220" height="16" fill="#ef4444"/>
    <text x="110" y="27" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">APRIL</text>
    <!-- grid -->
    <g font-family="Helvetica, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">
      <text x="22" y="58">S</text><text x="55" y="58">M</text><text x="88" y="58">T</text><text x="121" y="58">W</text><text x="154" y="58">T</text><text x="187" y="58">F</text><text x="210" y="58">S</text>
    </g>
    <g font-family="Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
      <text x="121" y="82">1</text><text x="154" y="82">2</text><text x="187" y="82">3</text>
      <text x="22" y="106">5</text><text x="55" y="106">6</text><text x="88" y="106">7</text><text x="121" y="106">8</text><text x="154" y="106">9</text><text x="187" y="106">10</text>
      <text x="22" y="130">12</text>
      <!-- highlighted day -->
      <circle cx="55" cy="126" r="11" fill="#fbbf24"/>
      <text x="55" y="130" font-weight="bold">13</text>
      <text x="88" y="130">14</text><text x="121" y="130">15</text><text x="154" y="130">16</text><text x="187" y="130">17</text>
      <text x="22" y="154">19</text><text x="55" y="154">20</text><text x="88" y="154">21</text>
    </g>
    <!-- pinned event blurb -->
    <rect x="14" y="166" width="192" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="181" font-family="Helvetica, sans-serif" font-size="10" fill="#1e40af">🍕 Lunch: Pepperoni Pizza</text>
  </g>

  <!-- the tray -->
  <g transform="translate(60, 145)">
    <!-- shadow -->
    <ellipse cx="195" cy="195" rx="200" ry="14" fill="#000" opacity="0.12"/>
    <!-- tray base -->
    <rect x="0" y="0" width="390" height="185" rx="18" fill="url(#tray)" stroke="#4b5563" stroke-width="2"/>
    <!-- dividers -->
    <line x1="200" y1="14" x2="200" y2="170" stroke="#6b7280" stroke-width="2"/>
    <line x1="200" y1="92" x2="375" y2="92" stroke="#6b7280" stroke-width="2"/>

    <!-- main compartment: a sandwich -->
    <g transform="translate(100, 95)">
      <!-- bottom bun -->
      <ellipse cx="0" cy="20" rx="60" ry="14" fill="#d97706"/>
      <!-- lettuce -->
      <path d="M -55 12 Q -40 4 -20 10 Q 0 0 25 10 Q 45 4 58 12 L 55 18 Q 30 14 0 18 Q -30 14 -55 18 Z" fill="#65a30d"/>
      <!-- cheese -->
      <rect x="-52" y="6" width="104" height="6" fill="#facc15"/>
      <!-- patty -->
      <ellipse cx="0" cy="0" rx="54" ry="10" fill="#7c2d12"/>
      <!-- top bun -->
      <path d="M -58 -2 Q -45 -28 0 -28 Q 45 -28 58 -2 Z" fill="#f59e0b"/>
      <!-- sesame seeds -->
      <circle cx="-30" cy="-14" r="1.8" fill="#fef3c7"/>
      <circle cx="-12" cy="-20" r="1.8" fill="#fef3c7"/>
      <circle cx="8" cy="-18" r="1.8" fill="#fef3c7"/>
      <circle cx="28" cy="-13" r="1.8" fill="#fef3c7"/>
    </g>

    <!-- top-right compartment: baby carrots -->
    <g transform="translate(285, 50)">
      <g fill="#f97316" stroke="#c2410c" stroke-width="1">
        <ellipse cx="-22" cy="0" rx="14" ry="6" transform="rotate(-25 -22 0)"/>
        <ellipse cx="0" cy="-8" rx="14" ry="6" transform="rotate(15 0 -8)"/>
        <ellipse cx="22" cy="-2" rx="14" ry="6" transform="rotate(-10 22 -2)"/>
        <ellipse cx="-10" cy="14" rx="14" ry="6" transform="rotate(30 -10 14)"/>
        <ellipse cx="18" cy="16" rx="14" ry="6" transform="rotate(-20 18 16)"/>
      </g>
    </g>

    <!-- bottom-right compartment: an apple -->
    <g transform="translate(285, 130)">
      <circle cx="0" cy="0" r="22" fill="#dc2626"/>
      <path d="M 0 -22 Q 4 -28 10 -30" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-6" cy="-10" rx="5" ry="3" fill="#fca5a5" opacity="0.8"/>
    </g>

    <!-- milk carton on the side -->
    <g transform="translate(40, 30)">
      <path d="M 0 0 L 40 0 L 40 70 L 0 70 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <path d="M 0 0 L 20 -12 L 40 0 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <text x="20" y="38" font-family="Helvetica, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">MILK</text>
    </g>
  </g>

  <!-- arrow from tray to calendar -->
  <g transform="translate(0, 0)">
    <path d="M 460 220 Q 490 200 510 210" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="5,5"/>
    <polygon points="508,204 520,212 506,218" fill="#1f2937"/>
  </g>
</svg>
