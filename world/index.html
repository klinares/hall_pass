<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natalia's World Tour</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fdb1cb;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #fdb1cb;
      outline: none;
    }
    #loading {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 220px;
      height: 10px;
      margin: -5px 0 0 -110px;
      border: 2px solid #000;
      border-radius: 6px;
      background: #fff;
      box-sizing: border-box;
      overflow: hidden;
    }
    #loading-fill {
      width: 0;
      height: 100%;
      background: #2f2fc1;
    }
    #message {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      width: 440px;
      max-width: calc(100% - 32px);
      transform: translate(-50%, -50%);
      font-family: "Courier New", Courier, monospace;
      font-size: 18px;
      line-height: 1.4;
      color: #000;
      text-align: center;
      text-transform: none;
    }
    #reload {
      display: none;
      margin: 20px auto 0;
      padding: 14px 44px;
      font-family: "Courier New", Courier, monospace;
      font-size: 28px;
      font-weight: bold;
      text-transform: lowercase;
      color: #000;
      background: #fff;
      border: 3px solid #000;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
    }
    #message small {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      color: #2f2fc1;
      text-transform: none;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1366" height="768" tabindex="-1"></canvas>
  <div id="loading"><div id="loading-fill"></div></div>
  <div id="message"></div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var fill = document.getElementById("loading-fill");
    var message = document.getElementById("message");

    var NO_3D = "this browser can't draw 3D right now. close the browser, open it again, and come back.";
    var LOST = "the picture stopped. press reload and your tour comes right back.";
    var unityInstance = null;
    var contextLost = false;
    var reloadButton = document.createElement("button");
    reloadButton.id = "reload";
    reloadButton.type = "button";
    reloadButton.textContent = "reload";
    reloadButton.onclick = function () { location.reload(); };
    document.body.appendChild(reloadButton);

    function say(text, withReload) {
      loading.style.display = "none";
      message.textContent = text;
      message.style.display = "block";
      if (withReload) {
        message.appendChild(reloadButton);
        reloadButton.style.display = "block";
        try { reloadButton.focus(); } catch (e) {}
      }
    }

    // Unity's own wording never reaches the child: anything about WebGL becomes the plain line.
    function showFailure(detail) {
      if (contextLost) return;
      if (detail) console.error(detail);
      if (/webgl|context/i.test(String(detail))) { say(NO_3D, false); return; }
      say("the show couldn't start. try reloading the page, or open it in chrome or edge.", false);
      if (detail) {
        // One short line for a grown-up to read out; the full error stays in the console.
        var line = String(detail).split(String.fromCharCode(10))[0];
        if (line.length > 120) line = line.slice(0, 117) + "...";
        var small = document.createElement("small");
        small.textContent = line;
        message.appendChild(small);
      }
    }

    // The browser can take the GPU away at any time (a second tab, a driver reset, low video memory).
    // Stop it from retrying silently, flush the save, and offer one big reload button.
    canvas.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      contextLost = true;
      console.warn("WT_CONTEXT_LOST");
      try { if (unityInstance) unityInstance.SendMessage("WorldGame", "FlushSaveFromJs"); } catch (err) {}
      say(LOST, true);
    }, false);
    canvas.addEventListener("webglcontextrestored", function () {
      // Unity's GPU objects are gone after a loss, so the page is not resumed in place: reload is the way back.
      console.warn("WT_CONTEXT_RESTORED");
      contextLost = true;
      say(LOST, true);
    }, false);

    // Chrome and Edge (both say "Chrome/" in the user agent; Firefox never does) get the high-performance request; every other browser gets the default (no powerPreference at all).
    function contextAttributes() {
      var attrs = { preserveDrawingBuffer: false };
      var ua = String(navigator.userAgent || "");
      if (/Chrom(e|ium)\//.test(ua) && !/Firefox\/|FxiOS\//.test(ua)) attrs.powerPreference = 2;
      return attrs;
    }

    // A canvas that stays blank with no error (a driver that accepts the context and then draws nothing) would look like a black screen. The game logs WT_WORLD_GAME_READY
    // when it has loaded and drawn its first place; if that line has not come 75 seconds after the loader finished, say so and offer reload. If it arrives later the note goes away.
    var gameReady = false, blankTimer = null, blankShown = false;
    var BLANK = "the picture didn't start. press reload. if it keeps happening, open this page in chrome or edge.";
    (function () {
      var original = console.log;
      console.log = function () {
        try {
          var first = arguments[0];
          if (!gameReady && typeof first === "string" && first.indexOf("WT_WORLD_GAME_READY") === 0) {
            gameReady = true;
            if (blankTimer) clearTimeout(blankTimer);
            if (blankShown) { message.style.display = "none"; reloadButton.style.display = "none"; blankShown = false; }
          }
        } catch (e) {}
        return original.apply(console, arguments);
      };
    })();
    var blankMs = 75000, blankArg = /[?&]wt_blank_ms=([0-9]+)/.exec(location.search);   // the page test shortens the wait
    if (blankArg) blankMs = +blankArg[1];
    function watchForBlank() {
      blankTimer = setTimeout(function () {
        if (gameReady || contextLost || message.style.display === "block") return;
        console.warn("WT_BLANK_CANVAS no ready line 75 s after load");
        blankShown = true;
        say(BLANK, true);
      }, blankMs);
    }

    var config = {
      dataUrl: "Build/09e9c96555674babb508baa57ab17474.data.unityweb",
      frameworkUrl: "Build/ec653ff5725af74a1fff69488c37e010.framework.js.unityweb",
      codeUrl: "Build/b25a470fbfac4049bfc242417086efde.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      // two-GPU laptops: ask for the dedicated card, on Chrome and Edge only (phase 10A: a Firefox on the owner's machine showed a black canvas with no error while the other browsers drew, so
      // Firefox and everything else get the default). Unity/emscripten read this as a number (0 default, 1 low-power, 2 high-performance);
      // the string "high-performance" would be looked up in that list and fall back to default.
      webglContextAttributes: contextAttributes(),
      companyName: "hall_pass",
      productName: "Natalia's World Tour",
      productVersion: "1.0",
      // Build files are named by content hash, so a cached copy can never be stale.
      // Anything else (index.html, StreamingAssets) is always fetched fresh.
      cacheControl: function (url) {
        // The loader passes the config URLs as written ("Build/<hash>.wasm.unityweb"),
        // so match "Build/" at the start of the URL as well as after a slash.
        return /(^|\/)Build\/[^\/]+$/.test(url) ? "immutable" : "no-store";
      },
      showBanner: function (msg, type) {
        if (type === "error" || /webgl/i.test(String(msg))) showFailure(msg);
        else console.warn(msg);
      },
    };

    var script = document.createElement("script");
    script.src = "Build/540b5478782149cc9e4a66cb7daad668.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(100 * progress) + "%";
      }).then(function (instance) {
        unityInstance = instance;
        window.__wtInstance = instance;
        watchForBlank();
        if (contextLost) return;
        loading.style.display = "none";
        canvas.focus();
      }).catch(function (err) {
        showFailure(err);
      });
    };
    script.onerror = function () {
      showFailure("the game files didn't load.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
